# Igual a mezcla_renovar_largo.yaml, con el espejo (simulador_nuevo, usar_espejo):
# cada emisor real tiene un reflejo (reflectividad ratio_reflejo en [0.5, 1], con recorte de pupila) y solo
# los reales son objetivo. Convencion: +z hacia el objetivo y el angulo del
# espejo desde el EJE OPTICO (beta; el montaje esta a 45 grados). La geometria
# del espejo se sortea por muestra (beta en espejo_angulo_eje_rango_deg, phi en
# [0, 360), linea en el borde del FOV), y la red recibe un segundo canal: la
# distancia con signo de cada pixel a la interseccion del espejo con el plano
# focal (/ el FOV). Se agrega la dilatacion 32 (campo receptivo 129 px) porque
# real y reflejo se separan hasta 2 d cos(beta) = 62 px con dist_max_espejo_um
# = 4 y beta = 40. El lado de los anillos de la PSF se cambia con
# --set datos.simulador.anillos_hacia_objetivo=true (pendiente del z-stack de beads).
# Las corridas anteriores (espejo_sz+-1) usaban la convencion vieja: no son
# compatibles con esta config (README, "Convencion de z").
#
# Igual a mezcla_renovar.yaml, pero con 100 epocas: con 50 la mejor epoca fue
# la 48 (la perdida de val seguia bajando).
#
# Igual a mezcla.yaml, pero con muestras de train nuevas en cada epoca
# (renovar_por_epoca) y 50 epocas: con las 20000 muestras fijas la corrida
# sobreajusta desde la epoca 8-9. La validacion sigue siendo el mismo
# conjunto fijo (seed_val) en todas las epocas.
#
# Igual a base.yaml, salvo prob_rango_completo: la mitad de las imagenes usa
# todo fotones_rango, asi la red ve emisores tenues junto a brillantes (con
# fotones_dispersion = 5 solo pasa con el 1.6% de los tenues).
#
# Configuracion base de la red de localizacion 3D (estilo DeepSTORM3D).
# Lo que no aparece toma el valor por defecto de config.py (y, en
# datos.simulador, el de simulador_nuevo/simulador.py). Cualquier campo se
# cambia desde la linea de comandos: --set datos.n_train=5000

datos:
  simulador:                  # campos de simulador.Config (menos n_frames, n_videos y seed)
    mascara: esferica
    H: 64
    W: 64
    n_emisores_rango: [1, 12]
    z_rango_nm: [-800.0, 800.0]
    fotones_rango: [1000.0, 30000.0]
    fondo_rango: [5.0, 40.0]
    usar_espejo: true
    angulo_espejo_eje_deg: 45.0   # beta desde el eje optico; centro del rango sorteado (espejo_angulo_eje_rango_deg)
    ratio_reflejo: 0.8          # sin uso: datos.ratio_reflejo_rango lo sortea por muestra
    recorte_pupila_reflejo: true   # el reflejo pierde los rayos que no cruzan el espejo (4.7% a 45 grados);
                                   # ratio_reflejo = reflectividad. ~13 ms por muestra con 8 workers
    dist_max_espejo_um: 4.0   # posiciones iniciales hasta 4 um del plano del espejo
    anillos_hacia_objetivo: false   # lado del foco con anillos de la PSF esferica (pendiente; las corridas
                                    # espejo_b45_lejos / espejo_b45_cerca difieren solo aqui)
  canales: 1
  fotones_dispersion: 5.0     # cada imagen usa un subrango de fotones con razon max/min 5
  prob_rango_completo: 0.5    # ... salvo la mitad, que usa todo fotones_rango
  prob_fondo_uniforme: 0.2
  read_noise_rango: null      # null -> 3.26 ADU (Orca Flash 4.0, el del simulador)
  normalizacion: robusta
  n_train: 20000
  n_val: 1000
  seed_train: 1
  seed_val: 2
  renovar_por_epoca: true     # epoca e: muestras e n_train ... (e + 1) n_train - 1 de seed_train
  espejo_angulo_eje_rango_deg: [40.0, 50.0]   # beta uniforme: 45 +- 5 grados desde el eje optico
  espejo_orientacion_aleatoria: true      # phi uniforme en [0, 360)
  espejo_punto_aleatorio: true            # punto de la linea del espejo aleatorio ...
  espejo_linea_rango_fov: [0.333, 1.1]    # ... con la linea espejo-plano focal en el tercio exterior del FOV (hasta
                                          # 10% fuera del borde) y phi hacia el interior: la imagen es casi toda
                                          # del lado de la muestra. null -> punto uniforme en el FOV
  canal_distancia_espejo: true            # entrada con 2 canales: imagen + distancia al espejo
  escala_distancia_px: null               # null -> max(H, W) = 64 px
  max_reintentos_espejo: 20
  ratio_reflejo_rango: [0.5, 1.0]         # calibracion por fotometria de los datos reales con recorte
                                          # (resultados_recorte_pupila.md): 0.55-1 segun z del real y beta

target:
  upsampling: 4               # 98.48 / 4 = 24.6 nm por voxel en x, y
  dz_nm: 50.0                 # 33 planos en [-800, 800] + 2 de margen a cada lado = 37
  planos_margen: 2
  sigma_xy_vox: 1.0
  sigma_z_vox: 1.0
  escala: 100.0

modelo:
  canales_base: 64
  dilataciones: [1, 2, 4, 8, 16, 32]   # campo receptivo 129 px (con 16: 65 px < separacion real-reflejo)
  modo_upsampling: bilinear
  capas_salida: 2
  norm: batch
  pendiente_leaky: 0.2
  activacion_salida: hardtanh

perdida:
  terminos: {mse: 1.0, dice: 1.0}
  suavizado_dice: 1.0

entrenamiento:
  nombre: espejo
  epocas: 100                 # ~4 min por epoca de 20000 muestras en la RTX 3060
  batch: 8                    # 1.2 GB con AMP; batch 16 cabe (2.4 GB)
  acumulacion: 1
  lr: 1.0e-3
  weight_decay: 1.0e-4
  amp: fp16
  clip_grad: null
  factor_lr: 0.5
  paciencia_lr: 3
  lr_min: 1.0e-5
  parada_temprana: null
  workers: 2                  # la GPU procesa ~85 muestras/s; un proceso simula ~250/s
  dispositivo: auto
  semilla: 0
  log_cada: 50
  datos_train: null           # carpetas de pregenerar.py; null -> on-the-fly
  datos_val: null
  carpeta_corridas: null      # null -> localizacion/corridas/

postproc:                     # no afecta el entrenamiento; infer.py lo cambia con --set postproc.umbral=0.3
  umbral: 0.4
  radio_xy_vox: 3             # ventana del maximo local: 7 x 7 voxeles (172 nm) ...
  radio_z_planos: 3           # ... por 7 planos (350 nm)
  radio_cm_xy_vox: 2          # ventana del centro de masa: 5 x 5 x 5
  radio_cm_z_planos: 2
  confianza: masa
