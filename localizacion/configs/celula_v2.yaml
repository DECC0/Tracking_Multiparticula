# Simulador v2 (resultados_simulador_v2.md): celula.yaml con los parametros medidos en Yeast6_1 y la
# PSF aleatorizada por muestra, solo para la variante cerca (anillos_hacia_objetivo true, signo fijo).
#   - camara: gain 0.45 e-/ADU (transferencia de fotones), offset 97.75 ADU (nivel oscuro) y ruido de
#     lectura uniforme en [2.18, 2.90] ADU (mediana y rms) por muestra (resultados_psf_real.md, seccion 4)
#   - fondo log-uniforme en [1, 40] e-/px (el real: 1.3-2.3 lejos de la celula) + autofluorescencia de la
#     celula, contraste en [0, 2.5] x el fondo base (medido: 0.46 izq, 1.83 der; autofluorescencia_celula.py)
#   - fotones hasta 50000 (el real del canal derecho: 35000-68000 en total)
#   - z de la red +-3000 nm, con peso en los polos de la celula (celula_peso_polos 0.5)
#   - PSF por muestra: esferica uniforme en [4.0, 6.5] rad (calibracion: 4.11 a 6.40, seccion 7 de
#     resultados_calibracion_pupila.md), astigmatismo y coma con magnitud uniforme en [0, 1.3] y [0, 0.9] rad
#     y orientacion uniforme; el real y su reflejo comparten la pupila de la muestra
# El resto (geometria, celula, ratio, red, entrenamiento) es el de celula.yaml.
#
datos:
  simulador:                  # campos de simulador.Config (menos n_frames, n_videos y seed)
    mascara: esferica
    H: 96
    W: 96
    n_emisores_rango: [1, 12]
    z_rango_nm: [-3000.0, 3000.0]   # rango axial de la red: toda la celula (diametro <= 6 um)
    fotones_rango: [1000.0, 50000.0]
    fondo_rango: [1.0, 40.0]
    muestreo_fondo: log           # log-uniforme: la mitad de las muestras con fondo base < 6.3 e-/px
    fondo_celula_contraste_rango: [0.0, 2.5]   # autofluorescencia: exceso en el centro / fondo base
    fondo_celula_sigma_px: 5.0    # blur del perfil de la celula (ajuste: 4.8-5.6 px)
    gain: 0.45                    # e-/ADU, medido (transferencia de fotones)
    offset: 97.75                 # ADU, nivel oscuro medido
    read_noise: 2.9               # ADU rms; sin uso: datos.read_noise_rango lo sortea por muestra
    usar_espejo: true
    angulo_espejo_eje_deg: 45.0   # beta desde el eje optico; centro del rango sorteado (espejo_angulo_eje_rango_deg)
    ratio_reflejo: 0.8          # sin uso: datos.ratio_reflejo_rango lo sortea por muestra
    recorte_pupila_reflejo: true   # el reflejo pierde los rayos que no cruzan el espejo (4.7% a 45 grados);
                                   # ratio_reflejo = reflectividad
    recorte_pupila_real: true      # el real pierde los rayos que chocan con el espejo (la misma mascara): el
                                   # portaobjetos espejado mide mm, infinito a escala de um
    usar_celula: true
    diametro_celula_um: 5.0
    altura_celula_nm: 0.0     # centro de la celula en el foco (pendiente de confirmar)
    celula_peso_polos: 0.5    # densidad en z (1 - w) 3/4 (1 - s^2) + w 3/2 s^2: no se vacian los polos
    anillos_hacia_objetivo: true    # variante cerca, signo fijo (lanzar_espejo.sh cerca lo vuelve a fijar)
    amp_esferica: 5.25        # solo la del banco (K y z); cada muestra sortea la suya (psf_amp_esferica_rango)
  canales: 1
  fotones_dispersion: 5.0     # cada imagen usa un subrango de fotones con razon max/min 5
  prob_rango_completo: 0.5    # ... salvo la mitad, que usa todo fotones_rango
  prob_fondo_uniforme: 0.2
  read_noise_rango: [2.18, 2.90]   # ADU rms: mediana y rms medidos fuera de las aperturas
  normalizacion: robusta
  n_train: 20000
  n_val: 1000
  seed_train: 1
  seed_val: 2
  renovar_por_epoca: true     # epoca e: muestras e n_train ... (e + 1) n_train - 1 de seed_train
  espejo_angulo_eje_rango_deg: [40.0, 50.0]   # beta uniforme: 45 +- 5 grados desde el eje optico
  espejo_orientacion_aleatoria: true      # phi uniforme en [0, 360)
  espejo_punto_aleatorio: false           # la linea del espejo la fija el contacto con la celula
  canal_distancia_espejo: true            # entrada con 2 canales: imagen + distancia al espejo
  escala_distancia_px: null               # null -> max(H, W) = 64 px
  max_reintentos_espejo: 20
  ratio_reflejo_rango: [0.45, 1.0]        # calibracion por fotometria de los datos reales con los recortes
                                          # (resultados_recorte_pupila.md): 0.50-1 segun z del real y beta
  celula_diametro_rango_um: [4.0, 6.0]
  celula_altura_rango_nm: null           # null -> altura_celula_nm
  celula_contacto_centrado: true          # contacto celula-espejo en el centro del FOV ...
  celula_desplazamiento_px: 10.0          # ... +- 10 px por eje
  psf_amp_esferica_rango: [4.0, 6.5]      # amp_esferica [rad] por muestra
  psf_astig_rango: [0.0, 1.3]             # magnitud de Z2^+-2 [rad], orientacion uniforme
  psf_coma_rango: [0.0, 0.9]              # magnitud de Z3^+-1 [rad], orientacion uniforme

target:
  upsampling: 4               # 98.48 / 4 = 24.6 nm por voxel en x, y
  dz_nm: 100.0                # 61 planos en [-3000, 3000] + 2 de margen a cada lado = 65
  planos_margen: 2
  sigma_xy_vox: 1.0
  sigma_z_vox: 1.0
  escala: 100.0

modelo:
  canales_base: 64
  dilataciones: [1, 2, 4, 8, 16, 32]   # campo receptivo 129 px (con 16: 65 px < separacion real-reflejo)
  modo_upsampling: bilinear
  capas_salida: 2
  norm: batch
  pendiente_leaky: 0.2
  activacion_salida: hardtanh

perdida:
  terminos: {mse: 1.0, dice: 1.0}
  suavizado_dice: 1.0

entrenamiento:
  nombre: celula_v2
  epocas: 100                 # ~4 min por epoca de 20000 muestras en la RTX 3060
  batch: 8                    # 1.2 GB con AMP; batch 16 cabe (2.4 GB)
  acumulacion: 1
  lr: 1.0e-3
  weight_decay: 1.0e-4
  amp: fp16
  clip_grad: null
  factor_lr: 0.5
  paciencia_lr: 3
  lr_min: 1.0e-5
  parada_temprana: null
  workers: 2                  # la GPU procesa ~85 muestras/s; un proceso simula ~250/s
  dispositivo: auto
  semilla: 0
  log_cada: 50
  checkpoint_cada: 10         # epoca_XXX.pt cada 10 epocas
  metricas_val: true          # recall, precision, Jaccard y RMSE de val en log.csv
  datos_train: null           # carpetas de pregenerar.py; null -> on-the-fly
  datos_val: null
  carpeta_corridas: null      # null -> localizacion/corridas/

postproc:                     # no afecta el entrenamiento; infer.py lo cambia con --set postproc.umbral=0.3
  umbral: 0.4
  radio_xy_vox: 3             # ventana del maximo local: 7 x 7 voxeles (172 nm) ...
  radio_z_planos: 3           # ... por 7 planos (350 nm)
  radio_cm_xy_vox: 2          # ventana del centro de masa: 5 x 5 x 5
  radio_cm_z_planos: 2
  confianza: masa
